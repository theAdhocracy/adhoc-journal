name: Build and deploy

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: adhoc-journal-production
  cancel-in-progress: false

jobs:
  build:
    name: Astro Build
    if: startsWith(github.event.release.tag_name, 'release-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Build Astro app
        run: npm run build

      - name: Upload deployment artifact
        # Uploads the build output and package manifests to be downloaded in the next deploy job.
        uses: actions/upload-artifact@v4
        with:
          name: astro-deployment
          path: |
            dist/
            package.json
            package-lock.json
          if-no-files-found: error

  deploy:
    name: Deploy to Production
    needs: build
    if: startsWith(github.event.release.tag_name, 'release-')
    runs-on: ubuntu-latest
    steps:
      - name: Download deployment artifact
        # Downloads the build output and package manifests from the previous build job.
        uses: actions/download-artifact@v4
        with:
          name: astro-deployment
          path: deployment

      - name: Configure SSH
        # Creates SSH folder & files, in restricted mode, within the GitHub runner environment.
        env:
          KRYSTAL_SSH_PRIVATE_KEY: ${{ secrets.KRYSTAL_SSH_PRIVATE_KEY }}
          KRYSTAL_SSH_KNOWN_HOSTS: ${{ secrets.KRYSTAL_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KRYSTAL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KRYSTAL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload build and package manifests
        # Uploads the build output and package manifests to the production server, replacing any existing files. Node modules are not required.
        # The rsync options: -a preserves file details; -z compresses upload; -e configures SSH with private keys; --delete removes any files on the server that are no longer built.
        env:
          KRYSTAL_SSH_HOST: ${{ secrets.KRYSTAL_SSH_HOST }}
          KRYSTAL_SSH_USER: ${{ secrets.KRYSTAL_SSH_USER }}
        run: |
          ssh_options="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          rsync -az --delete -e "$ssh_options" deployment/dist/ \
            "$KRYSTAL_SSH_USER@$KRYSTAL_SSH_HOST:/home/theadhoc/adhoc-journal/dist/"
          rsync -az -e "$ssh_options" deployment/package.json deployment/package-lock.json \
            "$KRYSTAL_SSH_USER@$KRYSTAL_SSH_HOST:/home/theadhoc/adhoc-journal/"

      - name: Install changed production dependencies
        # Connects to the Node app via SSH, compares the old and new lock file hashes, and install npm dependencies if they have changed. This prevents npm install running when it isn't needed, which can cause downtime if the server is under load.
        env:
          KRYSTAL_SSH_HOST: ${{ secrets.KRYSTAL_SSH_HOST }}
          KRYSTAL_SSH_USER: ${{ secrets.KRYSTAL_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "$KRYSTAL_SSH_USER@$KRYSTAL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          source /home/theadhoc/nodevenv/adhoc-journal/22/bin/activate
          cd /home/theadhoc/adhoc-journal

          lock_hash=$(sha256sum package-lock.json | cut -d ' ' -f 1)
          saved_hash=$(cat .deploy-lock-hash 2>/dev/null || true)
          if [ "$lock_hash" != "$saved_hash" ]; then
            npm ci --omit=dev
            printf '%s\n' "$lock_hash" > .deploy-lock-hash
          fi
          REMOTE
